[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opensearch-permission-compiler"
version = "0.1.0"
description = "Compile representative OpenSearch workflows into evidence-backed least-privilege role candidates."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenSearch Agent Skills Hackathon participant" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "PyYAML>=6.0"]

[project.scripts]
opensearch-permission-compiler = "permission_compiler.cli:main"

[tool.setuptools.packages.find]
where = ["skills/permission-compiler/scripts"]
include = ["permission_compiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
